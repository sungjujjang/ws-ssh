[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ws-ssh"
version = "0.1.0"
description = "PTY-based SSH relay + internal agent for WS-SSH"
requires-python = ">=3.10"
dependencies = [
    "asyncssh>=2.14",
    "websockets>=13",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]
windows = ["pywinpty>=2.0"]

[project.scripts]
ws-relay = "relay.__main__:main"
ws-agent = "agent.__main__:main"
ws-manage = "relay.manage:main"

[tool.setuptools]
packages = ["relay", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
